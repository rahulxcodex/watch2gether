# Deploys worker/ to Cloudflare on push — so the optional R2 library needs no
# CLI and nothing installed locally.
#
# One-time setup:
#   Cloudflare dashboard -> My Profile -> API Tokens -> Create Token
#     -> "Edit Cloudflare Workers" template
#   GitHub repo -> Settings -> Secrets and variables -> Actions
#     CLOUDFLARE_API_TOKEN   = the token
#     CLOUDFLARE_ACCOUNT_ID  = from the Workers & Pages overview page
#     UPLOAD_TOKEN           = any long random string
name: Deploy Worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            UPLOAD_TOKEN
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
